services:
  # Airflow service
  airflow:
    build: .
    command: standalone
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - PYTHONPATH=/opt/airflow/workspace:/opt/airflow/workspace/src
      - DBT_PROFILES_DIR=/home/airflow/.dbt

    volumes:
      - .:/opt/airflow/workspace
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ~/.aws:/home/airflow/.aws
      - ~/.dbt:/home/airflow/.dbt   
      - ./adverse_drugs_dbt:/opt/airflow/dags/adverse_drugs_dbt
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
